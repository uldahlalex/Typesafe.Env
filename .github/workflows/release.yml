# Push a tag like v1.0.0 to build the generator and attach Typesafe.Env.Generator.dll to a GitHub release of that name.
# Uses the built-in GITHUB_TOKEN, so there are no keys to manage.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Typesafe.Env.Generator -c Release
      - run: >
          gh release create "$GITHUB_REF_NAME"
          src/Typesafe.Env.Generator/bin/Release/netstandard2.0/Typesafe.Env.Generator.dll
          --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
