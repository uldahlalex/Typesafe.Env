# Every push to the default branch that changes the generator becomes a release: the next patch version of the
# ReleaseSeries in the csproj (v1.0.0, v1.0.1, ...), with Typesafe.Env.Generator.dll attached. Apps that don't pin
# TypesafeEnvVersion pick it up on their next build. Uses the built-in GITHUB_TOKEN, so there are no keys to manage.
name: release

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - '.github/workflows/release.yml'
  workflow_dispatch: # release manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: release # two quick pushes must not compute the same version
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the latest version

      - name: Next version
        id: version
        run: |
          series=$(sed -n 's:.*<ReleaseSeries>\(.*\)</ReleaseSeries>.*:\1:p' src/Typesafe.Env.Generator/Typesafe.Env.Generator.csproj)
          latest=$(git tag --list "v$series.*" --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then patch=0; else patch=$(( ${latest##*.} + 1 )); fi
          echo "version=$series.$patch" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build src/Typesafe.Env.Generator -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Release
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          src/Typesafe.Env.Generator/bin/Release/netstandard2.0/Typesafe.Env.Generator.dll
          --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
